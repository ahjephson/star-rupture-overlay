name: Prepare draft release

# Deliberate manual invocation only. This workflow cannot publish a release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed tag; update3 requires vMAJOR.MINOR.PATCH-update3.N
        required: true
        type: string
      release_checks_confirmed:
        description: Applicable release checks passed. Live game checks apply to game integration changes.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  package:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/update3') && inputs.release_checks_confirmed
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve reviewed tag and release channel
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          . ./scripts/Release-Policy.ps1
          $policy = Confirm-ReleaseTag -Tag $env:RELEASE_TAG -Branch $env:RELEASE_BRANCH
          git checkout --detach $policy.Commit
          if ($LASTEXITCODE -ne 0) { throw 'Could not check out release tag.' }
      - name: Install pinned tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          ./scripts/Install-QualityTools.ps1
      - name: Verify version and release inputs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          . ./scripts/Release-Policy.ps1
          $metadata = cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Metadata failed.' }
          $version = ($metadata.packages | Where-Object name -eq 'starrupture-overlay').version
          $null = Confirm-ReleaseTag -Tag $env:RELEASE_TAG -Branch $env:RELEASE_BRANCH -Version $version
          ./scripts/Test-PublicContent.ps1
          ./scripts/Test-Dependencies.ps1
      - name: Build and test release archive
        env:
          OVERLAY_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $buildLabel = if ($env:OVERLAY_RELEASE_TAG -match '-update3\.') { 'Pre-release build' } else { 'Release build' }
          ./scripts/Build.ps1 -OutputDirectory local/release-build
          ./scripts/Package-Release.ps1 -BuildDirectory local/release-build -OutputDirectory local/release-package
          $archive = Get-ChildItem local/release-package/*.zip
          ./scripts/Test-Release.ps1 -ArchivePath $archive.FullName -ExpectedBuildLabel $buildLabel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-release
          path: local/release-package/*
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: package
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reviewed-release
          path: release-files
      - name: Create an unpublished draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          . ./scripts/Release-Policy.ps1
          $policy = Confirm-ReleaseTag -Tag $env:RELEASE_TAG -Branch $env:RELEASE_BRANCH
          $assets = @(Get-ChildItem release-files -File | ForEach-Object FullName)
          $arguments = @('release', 'create', $policy.Tag) + $assets + @('--verify-tag', '--draft', '--target', $policy.Commit, '--title', "StarRupture Overlay $($policy.Tag)", '--notes', 'Portable Windows x64 candidate. Review the changelog, supported game version, live verification and checksums before publishing. Unsigned executable; checksums establish integrity, not publisher identity.')
          if ($policy.Prerelease) { $arguments += @('--prerelease', '--latest=false') }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed; existing releases were not overwritten.' }
