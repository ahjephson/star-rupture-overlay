name: Windows quality and package checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust components
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
      - name: Check tracked content and font provenance
        run: ./scripts/Test-PublicContent.ps1
      - name: Install pinned dependency checker
        run: ./scripts/Install-QualityTools.ps1
      - name: Audit dependency advisories, licences and sources
        run: ./scripts/Test-Dependencies.ps1
      - name: Format, lint, test and build
        run: ./scripts/Build.ps1 -OutputDirectory local/ci-build
      - name: Package candidate
        run: ./scripts/Package-Release.ps1 -BuildDirectory local/ci-build -OutputDirectory local/ci-package
      - name: Verify package, native rendering and disposable installer regressions
        run: |
          $archive = Get-ChildItem local/ci-package/*.zip
          ./scripts/Test-Release.ps1 -ArchivePath $archive.FullName
      - name: Retain tested candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-candidate
          path: local/ci-package/*
          if-no-files-found: error
          retention-days: 7
