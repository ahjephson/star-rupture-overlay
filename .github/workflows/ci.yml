name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust components
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
      - name: Restore Cargo and development build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target/debug
          key: ci-windows-2022-rust-1.99.1-v1-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', 'scripts/Common.ps1') }}-${{ github.sha }}
          restore-keys: |
            ci-windows-2022-rust-1.99.1-v1-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', 'scripts/Common.ps1') }}-
      - name: Check tracked content and font provenance
        run: ./scripts/Test-PublicContent.ps1
      - name: Install pinned dependency checker
        run: ./scripts/Install-QualityTools.ps1
      - name: Audit dependency advisories, licences and sources
        run: ./scripts/Test-Dependencies.ps1
      - name: Check formatting
        run: ./scripts/Format.ps1 -Check
      - name: Verify vendored files
        run: ./scripts/Verify-Vendor.ps1
      - name: Lint
        run: |
          . ./scripts/Common.ps1
          Initialize-Toolchain
          Invoke-Cargo @('clippy', '--workspace', '--all-targets', '--locked', '--', '-D', 'warnings')
      - name: Test
        run: |
          . ./scripts/Common.ps1
          Initialize-Toolchain
          Invoke-Cargo @('test', '--workspace', '--all-targets', '--locked')
      - name: Build development executable
        run: |
          . ./scripts/Common.ps1
          Initialize-Toolchain
          Invoke-Cargo @('build', '--workspace', '--locked')
      - name: Save Cargo and development build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target/debug
          key: ${{ steps.cache.outputs.cache-primary-key }}
