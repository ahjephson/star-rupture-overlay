name: Windows package verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'deny.toml'
      - 'third-party/**'
      - 'assets/**'
      - 'crates/wave-overlay/assets/**'
      - 'crates/wave-overlay/build.rs'
      - 'licenses/**'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - 'docs/PORTABLE-README.md'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'deny.toml'
      - 'third-party/**'
      - 'assets/**'
      - 'crates/wave-overlay/assets/**'
      - 'crates/wave-overlay/build.rs'
      - 'licenses/**'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - 'docs/PORTABLE-README.md'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust components
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
      - name: Restore Cargo and verification build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: verify-windows-2022-rust-1.99.1-v1-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', 'scripts/Common.ps1') }}-${{ github.sha }}
          restore-keys: |
            verify-windows-2022-rust-1.99.1-v1-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', 'scripts/Common.ps1') }}-
      - name: Check tracked content and font provenance
        run: ./scripts/Test-PublicContent.ps1
      - name: Install pinned dependency checker
        run: ./scripts/Install-QualityTools.ps1
      - name: Audit dependency advisories, licences and sources
        run: ./scripts/Test-Dependencies.ps1
      - name: Format, lint, test and build release executable
        run: ./scripts/Build.ps1 -OutputDirectory local/verify-build
      - name: Package candidate
        run: ./scripts/Package-Release.ps1 -BuildDirectory local/verify-build -OutputDirectory local/verify-package
      - name: Verify package, native rendering and disposable installer regressions
        run: |
          $archive = Get-ChildItem local/verify-package/*.zip
          ./scripts/Test-Release.ps1 -ArchivePath $archive.FullName
      - name: Retain tested candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-candidate
          path: local/verify-package/*
          if-no-files-found: error
          retention-days: 2
      - name: Save Cargo and verification build cache
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
