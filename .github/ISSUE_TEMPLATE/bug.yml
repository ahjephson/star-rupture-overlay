name: Bug report
description: Report a problem with the overlay.
body:
  - type: markdown
    attributes:
      value: Check the troubleshooting guide and existing issues first. Keep saves, settings, caches, extracted assets and memory dumps private.
  - type: input
    id: overlay
    attributes:
      label: Overlay version
      description: Find this in About from the tray menu.
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: StarRupture version
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include what you expected and the steps to reproduce it.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Support details
      description: Paste About > Copy support details. Check screenshots for personal information before attaching them.
