name: Bug report
description: Report an overlay problem without uploading private game data.
body:
  - type: input
    id: overlay
    attributes:
      label: Overlay version
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game version and Steam installation location
      description: Say default C drive or another location; do not include your account path.
  - type: textarea
    id: behavior
    attributes:
      label: What happened and how to reproduce it
      description: Include expected behavior. Do not attach memory dumps, saves, caches or personal settings.
    validations:
      required: true
