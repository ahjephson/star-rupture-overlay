[workspace]
members = ["retoc"]
resolver = "2"

[workspace.package]
version = "0.1.5"
edition = "2024"
authors = ["trumank", "Archengius"]
repository = "https://github.com/trumank/retoc"
homepage = "https://github.com/trumank/retoc"
license = "MIT"

[workspace.dependencies]
aes = "0.8.4"
anyhow = "1.0.100"
base64 = "0.22.1"
bitflags = "2.10.0"
blake3 = "1.8.2"
byteorder = "1.5.0"
cityhasher = "0.1.0"
clap = { version = "4.5.51", features = ["derive"] }
fs-err = "3.1.3"
hex = "0.4.3"
indexmap = { version = "2.12.0", features = ["serde"] }
indicatif = "0.18.2"
itertools = "0.14.0"
key-mutex = "0.1.3"
pariter = "0.5.1"
pretty_assertions = "1.4.1"
rayon = "1.11.0"
repak = { path = "../repak/repak", default-features = false }
ser-hex = { path = "../ser-hex/ser-hex" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_with = { version = "3.15.1", features = ["hex"] }
sha1 = "0.10.6"
strum = { version = "0.27.2", features = ["derive"] }
tracing = "0.1.41"
typed-path = "0.13.0"

[profile.release]
debug = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
