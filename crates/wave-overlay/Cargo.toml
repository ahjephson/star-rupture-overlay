[package]
name = "starrupture-wave-overlay"
description = "Native Windows HUD for StarRupture wave stages and countdowns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
serde.workspace = true
serde_json.workspace = true
starrupture-observation-model = { path = "../observation-model" }
starrupture-overlay-reader = { path = "../reader" }
starrupture-wave-core = { path = "../wave-core" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Gdi",
] }
