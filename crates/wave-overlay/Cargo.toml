[package]
name = "starrupture-overlay"
description = "Native Windows overlay for StarRupture rupture timing and recipe research"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }
starrupture-observation-model = { path = "../observation-model" }
starrupture-overlay-reader = { path = "../reader" }
starrupture-wave-core = { path = "../wave-core" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_JobObjects",
    "Win32_Storage_FileSystem",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Gdi",
] }
