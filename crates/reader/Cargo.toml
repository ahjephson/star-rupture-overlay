[package]
name = "starrupture-overlay-reader"
version = "0.5.0"
edition = "2024"
publish = false
autobins = false

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smol = "2"
jmap_dumper = { path = "../../third-party/jmap/jmap_dumper" }
patternsleuth = { path = "../../third-party/patternsleuth/patternsleuth", features = ["image-pe", "process-external"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }
iced-x86 = "1.21.0"
starrupture-observation-model = {path="../observation-model"}


[[bin]]
name = "starrupture-overlay-reader"
path = "src/overlay_reader_main.rs"
