[workspace]
members = ["crates/wave-overlay", "crates/reader", "crates/wave-core", "crates/observation-model", "crates/assets"]
exclude = ["third-party/jmap", "third-party/gospel", "third-party/patternsleuth", "third-party/ser-hex", "third-party/retoc", "third-party/repak"]
resolver = "3"

[workspace.package]
version = "0.2.7"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-PolyForm-Strict-1.0.0"
repository = "https://github.com/ahjephson/star-rupture-overlay"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
